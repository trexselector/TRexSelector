url: https://trexselector.github.io/TRexSelector/r/
template:
  bootstrap: 5
  light-switch: true
  # KaTeX, because MathJax loses autoloaded commands such as \boldsymbol in pkgdown >= 2.1.2 (r-lib/pkgdown#3037)
  math-rendering: katex
  bslib:
    primary: "#336C68"

footer:
  structure:
    left: copyright
    right: built_with
  components:
    copyright: Copyright © 2026 Team T-Rex

reference:
- title: T-Rex selectors and controls
  desc: The R6 selectors, their control lists, helpers and evaluation metrics.
  contents:
  - has_concept("T-Rex selectors and controls")
- title: T-solvers
  desc: The terminating solvers as R6 classes and their options.
  contents:
  - has_concept("T-solvers")
- title: ML methods
  desc: Scalers, regressions, decompositions and hierarchical clustering.
  contents:
  - has_concept("ML methods")
- title: Memory-mapped matrices
  desc: Disk-backed matrices accepted everywhere a matrix is.
  contents:
  - has_concept("memory-mapped matrices")

articles:
